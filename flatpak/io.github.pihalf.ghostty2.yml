app-id: io.github.pihalf.ghostty2
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
default-branch: beta
command: ghostty2
finish-args:
  # 3D rendering
  - --device=dri
  # use host PTS namespace
  - --device=all
  # Windowing
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # Allow user to specify additional config files in home by default
  - --filesystem=home:ro
  # So we can escape the sandbox
  - --talk-name=org.freedesktop.Flatpak
cleanup:
  - /include
  - /lib/girepository-1.0
  - /lib/pkgconfig
  - /share/gir-1.0
  - /share/pkgconfig
  - /share/vala
  - "*.la"
  - "*.a"
  - "*.so"

modules:
  - dependencies.yml

  - name: ghostty
    buildsystem: simple
    build-options:
      append-path: /app/zig
    build-commands:
      # Match nix/devShell.nix: Zig 0.17 rejects these pkg-config C flags.
      - mkdir -p /app/lib/pkgconfig
      - sed 's/-mfpmath=sse -msse -msse2//g'
        "$(pkg-config --variable=pcfiledir graphene-1.0)/graphene-1.0.pc"
        > /app/lib/pkgconfig/graphene-1.0.pc
      - sed 's/-Wl,--export-dynamic//g'
        "$(pkg-config --variable=pcfiledir gmodule-2.0)/gmodule-2.0.pc"
        > /app/lib/pkgconfig/gmodule-2.0.pc
      - zig build
        -Doptimize=fast
        -Dcpu=baseline
        -Dflatpak=true
        -Dinstalled-exe-path=/app/bin/ghostty2
        -Dstrip=false
        -fno-sys=oniguruma
        --prefix /app
        --search-prefix /app
        --system $PWD/vendor/p
    sources:
      - type: dir
        path: ..
        skip:
          - flatpak/.flatpak-builder
          - flatpak/builddir
          - flatpak/repo
          - zig-cache
          - zig-out

      - zig-packages.json
